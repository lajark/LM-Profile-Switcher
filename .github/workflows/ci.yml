name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run verification suite
        id: verify
        run: corepack pnpm run check 2>&1 | tee /tmp/check.log
        shell: bash
      - name: Surface failure detail (diagnostic)
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          TAIL=$(tail -120 /tmp/check.log | python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read()))")
          echo "::error file=check.log,title=check-tail::$TAIL"
        shell: bash
      - name: Policy and secret scan
        run: corepack pnpm run policy:scan -- --strict
