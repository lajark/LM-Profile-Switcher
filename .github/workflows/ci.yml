name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run verification suite
        run: corepack pnpm run check
      - name: Coverage baseline ratchet
        run: corepack pnpm run coverage:run && corepack pnpm run coverage:ratchet
      - name: Policy and secret scan
        run: corepack pnpm run policy:scan -- --strict
      - name: Strict dependency audit (M6-005)
        run: corepack pnpm run audit:deps:strict

  # M6-004 browser-mode desktop E2E (WebDriverIO + Chrome + in-memory fake
  # sidecar). Deliberately separate from, and non-blocking in addition to, the
  # root `check` gate: the Windows-shell suite stays local/manual because it
  # needs the built Tauri shell, sidecar SEA, tauri-driver and WebView2.
  e2e-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run browser-mode desktop E2E
        run: corepack pnpm --filter @lmps/desktop-e2e run e2e:browser
        env:
          CI: 'true'