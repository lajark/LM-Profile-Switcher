name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run verification suite
        shell: bash
        run: |
          set +e
          corepack pnpm run check > /tmp/check.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            python3 - <<'PY' >&2
import pathlib, re
t = pathlib.Path('/tmp/check.log').read_text(errors='replace')
t = re.sub(r'\x1b\[[0-9;]*m', '', t)
lines = t.splitlines()
sel = lines[-100:]
enc = lambda s: s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
msg = '%0A'.join(enc(l)[:500] for l in sel)[:3800]
print(f"::error title=check-failed rc={rc}::{msg}")
PY
          fi
          exit $rc
      - name: Policy and secret scan
        run: corepack pnpm run policy:scan -- --strict