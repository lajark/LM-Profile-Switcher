name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run verification suite
        id: verify
        run: corepack pnpm run check 2>&1 | tee /tmp/check.log
        shell: bash
      - name: Surface failure detail (diagnostic)
        if: failure() && steps.verify.outcome == 'failure'
        run: "tail -80 /tmp/check.log | sed 's/^/::error::verify: /'"
        shell: bash
      - name: Policy and secret scan
        run: corepack pnpm run policy:scan -- --strict
