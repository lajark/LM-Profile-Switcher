name: Draft Release (lightweight)

# M5-007: lightweight manual/tag Draft/Pre-release automation. Deliberately NO
# semantic-release / Changesets. Publisher is gated: the release step only runs
# after the build + release-pack + policy gates succeed, and it creates a Draft
# (not public). `fail_on_unmatched_files: true` refuses a partial release if any
# allowlisted asset is missing. Signing/notarization secrets are OPTIONAL and
# never logged.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match apps/desktop/src-tauri/tauri.conf.json)'
        required: true
        default: '0.2.0-beta.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install NSIS (Tauri NSIS bundler dependency)
        run: choco install nsis -y --no-progress
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build workspace packages (tsc -b emits @lmps/* dist)
        # The frontend imports @lmps/* through each package's `exports` map,
        # which resolves to ./dist/* — a fresh checkout has none. Build first.
        run: corepack pnpm run build
      - name: Build frontend + Tauri app (NSIS installer)
        # `tauri build` runs beforeBuildCommand (Vite) and produces the NSIS
        # currentUser installer under src-tauri/target/release/bundle/nsis/.
        # Rebuild the sidecar SEA binary first so the installer embeds current code.
        run: |
          corepack pnpm --filter @lmps/desktop run sidecar:sea
          corepack pnpm --filter @lmps/desktop run tauri:build
      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nsis-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 3

  verify-and-assemble:
    needs: build-windows-installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Resolve release version
        # dispatch input wins; tag triggers use the tag name minus the v prefix
        run: |
          VS="${{ inputs.version }}"
          if [ -z "$VS" ]; then VS="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$VS" >> "$GITHUB_ENV"
          echo "release version: $VS"
      - name: Download NSIS installer from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nsis-installer
          path: .ci-nsis
      - name: Stage NSIS installer where release-pack expects it
        run: |
          mkdir -p apps/desktop/src-tauri/target/release/bundle/nsis
          mv .ci-nsis/*.exe apps/desktop/src-tauri/target/release/bundle/nsis/
      - name: Verify source gates
        run: corepack pnpm run check
      - name: Coverage baseline ratchet
        run: corepack pnpm run coverage:run && corepack pnpm run coverage:ratchet
      - name: Version consistency
        # release-pack reads version from tauri.conf.json (single source); the
        # resolved version must match it — refused otherwise.
        run: |
          GOT=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GOT" != "$VERSION" ]; then
            echo "version mismatch: tauri.conf=$GOT resolved=$VERSION"; exit 1
          fi
          echo "version ok: $GOT"
      - name: Assemble allowlisted artifacts (release-pack)
        run: node scripts/release-pack.mjs --version "$VERSION"
      - name: Publish Draft (allowlisted assets only)
        if: ${{ !cancelled() && !failure() }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          files: |
            artifacts/releases/${{ env.VERSION }}/windows-x86_64/*.exe
            artifacts/releases/${{ env.VERSION }}/release-manifest.json
            artifacts/releases/${{ env.VERSION }}/checksums.sha256
            artifacts/releases/${{ env.VERSION }}/RELEASE_NOTES-*.md
            artifacts/releases/${{ env.VERSION }}/THIRD_PARTY_NOTICES.generated.md
            artifacts/releases/${{ env.VERSION }}/dependency-licenses.json
            artifacts/releases/${{ env.VERSION }}/LICENSE
            artifacts/releases/${{ env.VERSION }}/sbom.cdx.json
          fail_on_unmatched_files: true
          generate_release_notes: false