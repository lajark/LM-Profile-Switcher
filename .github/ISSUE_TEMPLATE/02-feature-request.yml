name: Feature request / 功能建议
description: Propose a feature with the problem and scope / 提出功能建议（含问题与边界）
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **EN** This project stays local-first and small-scope: no telemetry, no cloud, no LM Studio private-data access.
        **中文** 本项目坚持本地优先与小范围：无遥测、无云端、不访问 LM Studio 私有数据。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What are you trying to do, and what blocks you today? (no solution yet)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: How it would work and where it lives (CLI / desktop / hook / proxy / docs)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check / 范围确认
      options:
        - label: Works fully offline / 完全离线可用
        - label: No telemetry or cloud account / 无遥测与云账号
        - label: No reading/writing LM Studio private data / 不读写 LM Studio 私有数据
        - label: Bilingual zh-CN + en / 中英双语
