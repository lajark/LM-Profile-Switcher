[package]
name = "lmps-desktop"
version = "0.2.1-beta.1"
description = "LMPS desktop shell: Tauri host supervising the Node core-service sidecar"
authors = ["LM Profile Switcher"]
edition = "2021"

[lib]
name = "lmps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# M3-004: release optimization flags (opt-level=3 is cargo's release default;
# lto thin + codegen-units=1 + strip shrink the binary and the NSIS installer).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
